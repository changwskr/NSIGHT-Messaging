spring:
  application:
    name: nsight-message-mgmt-service
  profiles:
    active: local
  jackson:
    time-zone: Asia/Seoul
    date-format: yyyy-MM-dd'T'HH:mm:ss
  thymeleaf:
    cache: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:nsightmsg;MODE=Oracle;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1
    username: sa
    password:
    hikari:
      pool-name: MSG-HIKARI-POOL
      maximum-pool-size: 150
      minimum-idle: 10
      connection-timeout: 3000
      validation-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 300000
      auto-commit: false
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql

server:
  port: 8080
  shutdown: graceful
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    session:
      timeout: 60m
      cookie:
        http-only: true
        secure: false
        same-site: Lax
  tomcat:
    threads:
      max: 1500
      min-spare: 300
    accept-count: 800
    max-connections: 30000
    connection-timeout: 8s
    keep-alive-timeout: 60s

mybatis:
  config-location: classpath:mybatis/mybatis-config.xml
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.nh.nsight.messaging.message.thing,com.nh.nsight.messaging.file.thing

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  file:
    path: ./logs
  level:
    root: INFO
    com.nh.nsight.messaging: DEBUG
    com.nh.nsight.messaging.message.mapper: DEBUG
    com.nh.nsight.messaging.file.mapper: DEBUG

nsight:
  ap-id: MSG-LOCAL-AP01
  async:
    audit-log:
      core-pool-size: 50
      max-pool-size: 100
      queue-capacity: 1000
  transaction:
    default-timeout-seconds: 5
    readonly-timeout-seconds: 3
  webtop:
    request-timeout-ms: 15000
    connect-timeout-ms: 3000
    read-timeout-ms: 10000
    retry-count: 1
  absolute-session-timeout-hours: 8
  cruzapim:
    base-url: http://localhost:18080/mock-cruzapim
    connect-timeout-ms: 3000
    read-timeout-ms: 5000
    retry-enabled: false
  file:
    storage-path: ./data/nsight-files
    max-file-size-bytes: 10485760
    allowed-extensions: pdf,doc,docx,xls,xlsx,ppt,pptx,txt,csv,json,xml,zip,hwp,png,jpg,jpeg,gif
  message-log:
    enabled: true
    storage-path: ./data/nsight-messages
    max-body-bytes: 1048576
  trace-dump:
    evidence-path: ./data/trace-dump-evidence
  env-check:
    default-project-id: nsight-message-mgmt
    default-project-name: NSIGHT Message Management
    default-env-code: local
    hardware-profile: nsight-32core-256gb
    center-type: DR
    branch-count: 6000
    users-per-branch: 6
    total-users: 36000
    actual-request-users: 1800
    actual-request-peak-percent: 5
    session-design-count: 36000
    session-buffered-min: 43000
    session-buffered-max: 47000
    base-tps: 360
    peak-tps: 600
    high-peak-tps: 1200
    stress-tps: 1800
    vm-max-tps: 1000
    peak-concurrent-users: 1800
    ap-count: 2
    ap-vm-spec: 32 vCPU / 256GB
    target-p95-ms: 3000
    l4-idle-timeout-ms: 80000
    l4-was-idle-timeout-sec: 80
    l4-health-interval-sec: 5
    l4-health-timeout-sec: 2
    l4-health-fail-count: 3
    l4-sticky-timeout-sec: 70
    gslb-health-interval-sec: 5
    gslb-health-timeout-sec: 2
    gslb-health-fail-count: 3
    gslb-sticky-timeout-sec: 70
    proxy-read-timeout-ms: 10000
    db-session-limit: 500
    tomcat-max-threads: 1500
    tomcat-accept-count: 800
    tomcat-max-connections: 30000
    hikari-pool-general: 150
  oom-inspector:
    default-source-root: ./src/main/java
    default-mapper-root: ./src/main/resources/mapper
    default-config-path: ./src/main/resources/application.yml
    profile-name: nsight-32core-256gb
    fail-on-critical: true

---
spring:
  config:
    activate:
      on-profile: prd
  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    url: jdbc:oracle:thin:@//rdw-scan.nh.local:1521/RDWPRD
    username: MSG_APP
    password: ${MSG_DB_PASSWORD}
    hikari:
      pool-name: MSG-HIKARI-POOL-PRD
      maximum-pool-size: 150
      minimum-idle: 10
      connection-timeout: 3000
      validation-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 300000
      auto-commit: false
  h2:
    console:
      enabled: false
  sql:
    init:
      mode: never

server:
  servlet:
    session:
      cookie:
        secure: true

logging:
  file:
    path: /logs/msg-ap
  level:
    root: INFO
    com.nh.nsight.messaging: INFO

nsight:
  message-log:
    storage-path: /data/nsight-messages
  ap-id: ${AP_ID:MSG-C1-AP01}
  cruzapim:
    base-url: ${CRUZAPIM_BASE_URL:https://cruzapim.nh.local}
