<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{traceenvironment/fragments/env-page-head :: head('ENV-004 계층')}"></head>
<body data-env-page="env004">
<th:block th:replace="~{traceenvironment/fragments/env-page-head :: topbar('ENV-004 — 계층별 설정 점검')}"></th:block>

<div id="statusBar" class="status-bar hidden" role="status"></div>

<main class="env-layout">
    <div id="envNoDataBanner" class="env-no-data-banner">
        <p>산정 결과가 없습니다. <a href="/traceenvironment/env-002">ENV-002</a>에서 「산정 실행」 후 다시 열어 주세요.</p>
    </div>

    <section class="card env-screen" id="env004Section">
        <div class="card-title row-title">
            <div class="env-env004-criteria-wrap">
                <h2>ENV-004 계층별 설정 점검</h2>
                <p class="env-env004-criteria__stack-hint">스택: UI → GSLB → L4 → Apache → Tomcat → <strong>JVM</strong> → Spring Boot → MyBatis</p>
                <div id="env004CriteriaPanel" class="env-env004-criteria env-env004-criteria--empty" role="region" aria-label="점검 기준값">
                    <p class="env-env004-criteria__placeholder">ENV-002 산정 실행 후 점검 기준값이 표시됩니다.</p>
                </div>
            </div>
            <th:block th:replace="~{traceenvironment/fragments/env-export-btn :: excelBtn('ENV004', 'Excel 다운로드')}"></th:block>
        </div>

        <div class="env-env004-tabs" id="env004LayerTabs">
            <p class="env-env004-tabs__hint">계층 탭을 선택하면 해당 스택의 권장값·현재값·조치 가이드를 확인합니다.</p>
            <div class="env-env004-tabs__nav-wrap">
                <div class="env-env004-tabs__nav" id="env004TabNav" role="tablist" aria-label="스택 계층"></div>
            </div>
            <div class="env-env004-tabs__panels" id="env004TabPanels">
                <p class="env-empty-cell">산정 실행 후 계층별 설정이 표시됩니다.</p>
            </div>
        </div>

        <p class="env-screen-footer-hint"><a href="/traceenvironment/env-003">← ENV-003 TPS·VM</a> · <a href="/traceenvironment/check">종합 보고서 →</a></p>
    </section>
</main>

<script src="/js/traceenvironment-planner.js"></script>
<script src="/js/traceenvironment-export.js"></script>
</body>
</html>
