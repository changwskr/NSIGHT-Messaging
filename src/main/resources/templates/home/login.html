<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>NSIGHT 로그인</title>
    <link rel="stylesheet" href="/css/nsight.css"/>
</head>
<body class="login-page">
<div class="login-wrap">
    <section class="login-card card">
        <div class="login-brand">
            <span class="login-brand__badge">HOME</span>
            <h1>NSIGHT 로그인</h1>
            <p>메시징 관리 포털에 접속합니다.</p>
        </div>

        <p th:if="${loginError}" class="login-error" role="alert">아이디 또는 비밀번호가 올바르지 않습니다.</p>

        <form class="login-form" method="post" th:action="@{/home/login}">
            <input type="hidden" name="redirect" th:value="${redirect}"/>
            <label>
                아이디
                <input type="text" name="loginId" autocomplete="username" required placeholder="admin"/>
            </label>
            <label>
                비밀번호
                <input type="password" name="loginPassword" autocomplete="current-password" required placeholder="비밀번호"/>
            </label>
            <button type="submit">로그인</button>
        </form>

        <p class="login-hint">샘플 계정: <code>admin</code> / <code>1234</code></p>
    </section>
</div>
</body>
</html>
