<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>NSIGHT 메시징 관리</title>
    <link rel="stylesheet" href="/css/nsight.css"/>
</head>
<body>
<header class="topbar">
    <div>
        <h1>NSIGHT 메시징 관리 서비스</h1>
        <p>메시지 등록 · 조회 · 표준 응답 전문 확인</p>
    </div>
    <div class="badge">MSG-MGMT</div>
</header>

<main class="layout">
    <section class="card form-card">
        <div class="card-title">
            <h2>메시지 등록</h2>
            <p>WebTopSuite / BI Portal / 공통 오류처리에서 사용할 메시지를 등록합니다.</p>
        </div>

        <form id="messageForm" class="grid-form">
            <label>
                메시지 코드
                <input name="messageCode" placeholder="MSG_NOTICE_001" required maxlength="50"/>
            </label>
            <label>
                메시지명
                <input name="messageName" placeholder="공지 메시지" required maxlength="100"/>
            </label>
            <label>
                메시지 유형
                <select name="messageType" required>
                    <option value="INFO">INFO</option>
                    <option value="NOTICE">NOTICE</option>
                    <option value="WARN">WARN</option>
                    <option value="ERROR">ERROR</option>
                    <option value="CONFIRM">CONFIRM</option>
                </select>
            </label>
            <label>
                채널
                <select name="channelCode" required>
                    <option value="WEBTOPSUITE">WEBTOPSUITE</option>
                    <option value="BI_PORTAL">BI_PORTAL</option>
                    <option value="ALL">ALL</option>
                    <option value="MOBILE">MOBILE</option>
                    <option value="ADMIN">ADMIN</option>
                </select>
            </label>
            <label>
                Locale
                <input name="locale" value="ko_KR" required maxlength="10"/>
            </label>
            <label>
                사용 여부
                <select name="useYn" required>
                    <option value="Y">Y</option>
                    <option value="N">N</option>
                </select>
            </label>
            <label>
                표시 시작일시
                <input name="displayStartAt" type="datetime-local"/>
            </label>
            <label>
                표시 종료일시
                <input name="displayEndAt" type="datetime-local"/>
            </label>
            <label class="wide">
                메시지 내용
                <textarea name="messageContent" rows="6" placeholder="사용자에게 표시할 메시지를 입력하십시오." required maxlength="4000"></textarea>
            </label>
            <div class="actions wide">
                <button type="submit">메시지 등록</button>
                <button type="button" class="secondary" id="resetBtn">초기화</button>
                <button type="button" class="secondary" id="reloadBtn">목록 새로고침</button>
            </div>
        </form>
    </section>

    <section class="card">
        <div class="card-title">
            <h2>등록 결과 / 표준 전문</h2>
            <p>응답은 Header / Body / Control / Security / Error 구조로 반환됩니다.</p>
        </div>
        <pre id="resultBox" class="result-box">등록하면 표준 응답 전문이 여기에 표시됩니다.</pre>
    </section>
</main>

<section class="card full">
    <div class="card-title row-title">
        <div>
            <h2>메시지 목록</h2>
            <p>최근 등록된 메시지 기준으로 조회합니다.</p>
        </div>
        <div class="filters">
            <select id="filterType">
                <option value="">전체 유형</option>
                <option value="INFO">INFO</option>
                <option value="NOTICE">NOTICE</option>
                <option value="WARN">WARN</option>
                <option value="ERROR">ERROR</option>
                <option value="CONFIRM">CONFIRM</option>
            </select>
            <select id="filterChannel">
                <option value="">전체 채널</option>
                <option value="WEBTOPSUITE">WEBTOPSUITE</option>
                <option value="BI_PORTAL">BI_PORTAL</option>
                <option value="ALL">ALL</option>
            </select>
        </div>
    </div>
    <div class="table-wrap">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>코드</th>
                <th>명칭</th>
                <th>유형</th>
                <th>채널</th>
                <th>사용</th>
                <th>활성</th>
                <th>등록자</th>
                <th>등록일시</th>
            </tr>
            </thead>
            <tbody id="messageTableBody"></tbody>
        </table>
    </div>
</section>

<script src="/js/message-register.js"></script>
</body>
</html>
