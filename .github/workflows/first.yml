name: NSIGHT Messaging Maven Build

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nsight-messaging-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build on Ubuntu Latest
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Seoul

      # Maven 자체 JVM 메모리
      MAVEN_OPTS: >-
        -Xms1g
        -Xmx3g
        -XX:MaxMetaspaceSize=512m
        -Dfile.encoding=UTF-8
        -Duser.timezone=Asia/Seoul

      # Maven 내부에서 실행되는 Java 프로세스에도 적용
      JAVA_TOOL_OPTIONS: >-
        -Xms1g
        -Xmx3g
        -XX:MaxMetaspaceSize=512m
        -Dfile.encoding=UTF-8
        -Duser.timezone=Asia/Seoul

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Check runner environment
        run: |
          echo "===== OS ====="
          cat /etc/os-release

          echo "===== Java ====="
          java -version

          echo "===== Maven ====="
          mvn -version

          echo "===== JVM Memory Options ====="
          echo "MAVEN_OPTS=$MAVEN_OPTS"
          echo "JAVA_TOOL_OPTIONS=$JAVA_TOOL_OPTIONS"

      - name: Build with Maven
        run: mvn -B clean package

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nsight-messaging-build
          path: |
            target/*.jar
            target/*.war
            target/surefire-reports/**
          if-no-files-found: warn
